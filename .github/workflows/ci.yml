name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      # One OS failing must not cancel the other: a Linux-only break is exactly
      # the signal this matrix exists to surface.
      fail-fast: false
      matrix:
        # Branch protection on main requires the literal context "Build and diff
        # check". Renaming the Windows leg would leave every PR permanently
        # pending and enforce_admins would stop even an admin from merging, so
        # that context name is preserved verbatim rather than rebuilt from
        # matrix.os.
        include:
          - os: windows-latest
            name: Build and diff check
          - os: ubuntu-latest
            name: Build and verify (Linux)
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Our suite spawns processes and writes throwaway trees constantly, which
      # is what Defender scans. The same tests take ~1s on Linux and ~25s here,
      # so the gap is the scanner, not the code. Both exclusions are scoped to
      # trees the run owns and die with the ephemeral runner.
      #
      # Best-effort on purpose: a hardened image can refuse Add-MpPreference, and
      # a CI lane must not go red because an optimisation was unavailable.
      - name: Exclude runner work and temp trees from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath $env:GITHUB_WORKSPACE -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath $env:RUNNER_TEMP -ErrorAction SilentlyContinue

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24    # antes: 22 — alinear con el runtime real y @types/node@24
          # v5 turns package-manager caching on by default and probes for pnpm
          # before Corepack has been enabled, which fails the job. This repo
          # never used setup-node caching, so keep it off as v4 did.
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install

      - name: Build
        run: corepack pnpm build

      - name: Verify (tests + protocol and hygiene gates)
        run: corepack pnpm verify

      - name: Check diff whitespace
        run: git diff --check

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build and diff check
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24    # antes: 22 — alinear con el runtime real y @types/node@24
          # v5 turns package-manager caching on by default and probes for pnpm
          # before Corepack has been enabled, which fails the job. This repo
          # never used setup-node caching, so keep it off as v4 did.
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: corepack pnpm install

      - name: Build
        run: corepack pnpm build

      - name: Verify (tests + protocol and hygiene gates)
        run: corepack pnpm verify

      - name: Check diff whitespace
        run: git diff --check
